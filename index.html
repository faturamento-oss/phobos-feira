<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--card:#FFFFFF;--card-line:#E3E3E3;--field:#FFFFFF;--field-line:#BDBDBD;
  --ink:#0A0A0A;--ink2:#3D3D3D;--muted:#767676;--accent:#0A0A0A;--accent-ink:#FFFFFF;--sage:#0A0A0A;--sand:#0A0A0A;
  --ok:#0A0A0A;--warn:#0A0A0A;--bad:#0A0A0A;--hover:#F3F3F3;--soft:#F6F6F6;--r:10px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-tema=escuro]{
  --bg:#000000;--surface:#0B0B0B;--card:#0B0B0B;--card-line:#2A2A2A;--field:#000000;--field-line:#4A4A4A;
  --ink:#F5F5F5;--ink2:#C8C8C8;--muted:#8E8E8E;--accent:#FFFFFF;--accent-ink:#000000;--sage:#F5F5F5;--sand:#F5F5F5;
  --ok:#F5F5F5;--warn:#F5F5F5;--bad:#F5F5F5;--hover:#161616;--soft:#121212;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:8px;filter:grayscale(1) contrast(1.15)}
.brand small{display:block;font-weight:600;letter-spacing:.12em;font-size:10px;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:10px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav svg{width:18px;height:18px}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--card-line);font-size:12px;color:var(--ink2);white-space:nowrap;background:var(--card);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ink)}.dot.warn{background:transparent;border:2px solid var(--ink)}.dot.bad{background:transparent;border:2px dashed var(--ink)}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--card-line);background:var(--card);cursor:pointer;color:var(--ink2)}
.ib:hover{color:var(--ink);border-color:var(--field-line)}
.ib svg{width:18px;height:18px}
main{max-width:1440px;margin:0 auto;padding:18px}
/* generic */
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--field-line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);background:var(--hover)}
.btn.danger{color:var(--ink);border:1px solid var(--ink);font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:14px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:600;min-width:0}
input.i,select.i,textarea.i{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--field-line);background:var(--field);outline:none;min-width:0}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
textarea.i{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.muted{color:var(--muted)}
.small{font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--card-line);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.bad{color:var(--ink);border-color:var(--ink);text-decoration:line-through}
.tag.warn{color:var(--ink);border:1px dashed var(--ink)}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ptitle h1{font-size:22px}
.ptitle .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--card-line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--card-line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--card-line);vertical-align:middle}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--hover)}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.tbl td.nw{white-space:nowrap}
.tbl tr.off td{opacity:.5}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sage)}
.barw{background:var(--soft);border-radius:4px;width:100%}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:clamp(18px,2vw,24px);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
/* PDV */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.search{position:relative}
.search input{padding:14px 48px 14px 44px;font-size:16px;border-radius:12px}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search .cam{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--card-line);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pc .im{aspect-ratio:4/3;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--muted);border-bottom:1px solid var(--card-line)}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}.pc .im svg{width:28px;height:28px;opacity:.45}
.pc .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--hover);flex:none;border:1px solid var(--card-line)}
.fotoed{display:flex;gap:14px;align-items:center}.fotoed .pv{width:112px;height:112px;border-radius:12px;border:1px dashed var(--card-line);background:var(--hover);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--muted)}
.fotoed .pv img{width:100%;height:100%;object-fit:cover}.fotoed .pv svg{width:30px;height:30px;opacity:.45}
.pc:hover{border-color:var(--accent)}
.pc .n{font-weight:700;line-height:1.25;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .s{font-size:11px;color:var(--muted);overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .p{margin-top:auto;padding-top:6px;font-weight:800;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.pc .e{font-size:11px;color:var(--muted)}
.pc .e.low{color:var(--ink);font-weight:700}.pc .e.neg{color:var(--ink);font-weight:800;text-decoration:underline}
.cart{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.cart .hd{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--card-line)}
.cart .items{overflow:auto;flex:1;min-height:80px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--card-line)}
.ci .n{font-weight:600;line-height:1.25}
.ci .s{font-size:11px;color:var(--muted)}
.ci .t{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--field-line);background:var(--field);cursor:pointer;font-weight:700}
.qty input{width:54px;text-align:center;padding:4px;border-radius:8px;border:1px solid var(--field-line);background:var(--field)}
.ci .ex{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.ci .ex input{width:64px;padding:4px 6px;border-radius:8px;border:1px solid var(--field-line);background:var(--field);text-align:right}
.tot{padding-top:10px;display:flex;flex-direction:column;gap:6px}
.tot .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.tot .big{font-size:28px;font-weight:800}
.tot .big span:last-child{color:var(--ink)}
.desc{display:flex;gap:6px;align-items:center}
.desc input{width:90px;text-align:right;padding:6px 8px;border-radius:8px;border:1px solid var(--field-line);background:var(--field)}
.desc select{padding:6px;border-radius:8px;border:1px solid var(--field-line);background:var(--field)}
.mbar{display:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
.md{background:var(--surface);border:1px solid var(--card-line);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.md.w{max-width:900px}.md.s{max-width:420px}
.md .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--card-line)}
.md .mh h2{font-size:17px;flex:1}
.md .mb{padding:18px;display:flex;flex-direction:column;gap:12px}
.md .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--card-line);flex-wrap:wrap}
.pays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pays button{padding:14px 8px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.pays button svg{width:22px;height:22px}
.pays button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.paybox{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--card-line)}
.paybox .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;gap:6px}
.plist svg{width:18px;height:18px;flex:none}
.plist .pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--card-line)}
/* toast */
.toasts{position:fixed;left:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-left:4px solid var(--ink);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:360px}
.toast.warn{border-left:4px dashed var(--bg)}.toast.bad{border-left:6px double var(--bg);font-weight:600}
/* receipt */
.rec{background:#fff;color:#111;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:14px;border-radius:8px;max-width:340px;margin:0 auto}
.rec h3{font:700 14px/1.3 var(--font);text-align:center;margin:0}
.rec .c{text-align:center}
.rec hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rec table{width:100%;border-collapse:collapse}
.rec td{padding:1px 0;vertical-align:top}
.rec td.r{text-align:right;white-space:nowrap}
#print{display:none}
@media print{
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block}
  body.printing{background:#fff}
  #print .rec{max-width:none;padding:0}
  @page{margin:6mm}
}
.sel-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--ink);margin-bottom:10px;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) 90px 32px;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--card-line);border-radius:10px}
.note{padding:10px 12px;border-radius:10px;background:var(--soft);border:1px dashed var(--ink);font-size:13px}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
video.scan{width:100%;border-radius:12px;background:#000;max-height:50vh}
.hide{display:none!important}

/* NF-e */
.spin{width:34px;height:34px;border:3px solid var(--card-line);border-top-color:var(--ink);border-radius:50%;margin:0 auto;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-style:dashed}}
.paybox.inv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nfbox{border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px}
.nfhead{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--ink);border-radius:10px}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;border:1.5px solid var(--ink);background:var(--bg);transition:.15s;cursor:pointer}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:.15s}
.sw input:checked+span{background:var(--ink)}
.sw input:checked+span::after{left:21px;background:var(--bg)}
.sw input:disabled+span{opacity:.35;cursor:not-allowed}
.sw input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.danfe-wrap{overflow:hidden;background:#fff;border-radius:8px;padding:8px}
.danfe{position:relative;background:#fff;color:#000;font:9px/1.25 Arial,Helvetica,sans-serif;width:780px;max-width:none;margin:0 auto}
.danfe .wm{position:absolute;top:45%;left:0;right:0;text-align:center;font-size:34px;font-weight:800;color:rgba(0,0,0,.12);transform:rotate(-18deg);pointer-events:none;letter-spacing:.04em}
.danfe .dt{width:100%;border-collapse:collapse;margin-top:-1px}
.danfe .dt td,.danfe .dt th{border:1px solid #000;padding:2px 4px;vertical-align:top}
.danfe .dl{font-size:6.5px;text-transform:uppercase;color:#000}
.danfe .dv{font-size:9.5px;font-weight:600;min-height:12px}
.danfe .sh{font-size:7.5px;font-weight:700;margin:5px 0 1px}
.danfe .em{font-size:10px;line-height:1.35}
.danfe .small2{font-size:7px}
.danfe .bx{display:inline-block;border:1px solid #000;padding:0 4px;font-weight:700}
.danfe .bc{width:100%;height:42px;display:block}
.danfe .dp th{font-size:6.5px;text-align:left;font-weight:700}
.danfe .dp td{font-size:8px}
.danfe .r{text-align:right}
.danfe .w50{width:50%}.danfe .w60{width:60%}
@media print{body.printing #print .danfe{width:auto;zoom:1!important}}
/* responsive */
@media (max-width:1100px){.pdv{grid-template-columns:minmax(0,1fr) 340px}.nav button span{display:none}}
@media (max-width:860px){
  .pdv{grid-template-columns:1fr}
  .cart{position:static;max-height:none}
  .split{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  main{padding:12px 12px calc(var(--navh,64px) + var(--mbarh,0px) + 24px)}
  .top{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--card-line);justify-content:space-around;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 2px 6px;flex:1;min-width:0;border-radius:12px;line-height:1.1}
  .nav svg{width:20px;height:20px;flex:none}
  .nav button span{display:block}
  .pill .txt{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto}
  .pays{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{border:1px solid var(--card-line);border-radius:12px;margin-bottom:8px;padding:6px 10px;background:var(--card)}
  .tbl.cards td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left}
  .tbl.cards td.r,.tbl.cards td.c{text-align:right}
  .tbl.cards td[data-l=""]::before{content:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:var(--navh,64px);z-index:35;padding:10px 12px;background:var(--surface);border-top:1px solid var(--card-line);align-items:center;gap:10px}
  .mbar:empty{display:none}
  .mbar .v{font-size:20px;font-weight:800;color:var(--ink);flex:1}
  .toasts{bottom:calc(var(--navh,64px) + var(--mbarh,0px) + 12px);left:12px;right:12px}
  .ov{padding:0;align-items:flex-end}
  .md{border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
}
</style>
</head>

/* Tudo vive no Supabase. Aqui fica só uma cópia em memória (D) para a tela,

const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js';
let SB=null,EU=null,USR=null;
const D={produtos:{},estoque:{},feiras:{},caixas:{},vendas:{},config:{geral:{}},clientes:{},perfis:{},agente:null,numeracao:{}};
let CTX=ls.get('phfeira.ctx',{feira:'',caixa:''});

const uid=()=>(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const FISCAL_PADRAO={ambiente:2,serie:1,crt:1,indPres:5,natOp:'VENDA DE MERCADORIA FORA DO ESTABELECIMENTO',cfop:'5104',csosn:'102',cstIcms:'00',pIcms:0,pisCst:'99',pPis:0,cofinsCst:'99',pCofins:0,infCpl:'',respTec:{}};

async function saveCfg(p){const novo=Object.assign({},D.config.geral||{},p);const {error}=await SB.from('config').update({dados:novo,atualizado_em:new Date().toISOString()}).eq('id',1);if(error){toast(erroTxt(error),'bad');return false}D.config.geral=novo;return true}
const ehAdmin=()=>!!(EU&&EU.ativo&&EU.papel==='admin');

/* conversão banco ⇄ tela */
const prodDb=r=>({id:r.id,sku:r.sku,nome:r.nome,ean:r.ean||'',cat:r.cat||'',var:r.var||'',preco:+r.preco,custo:+r.custo,min:+r.minimo,un:r.un||'UN',ncm:r.ncm||'',cest:r.cest||'',orig:+r.orig||0,cfop:r.cfop||'',ativo:r.ativo,foto:r.foto||''});
const prodParaDb=p=>({id:p.id,sku:p.sku,nome:p.nome,ean:p.ean||null,cat:p.cat||null,var:p.var||null,preco:p.preco,custo:p.custo||0,minimo:p.min||0,un:p.un||'UN',ncm:p.ncm||null,cest:p.cest||null,orig:+p.orig||0,cfop:p.cfop||null,foto:p.foto||null,ativo:p.ativo!==false,atualizado_em:new Date().toISOString()});
const vendaDb=r=>({id:r.id,num:String(r.num).padStart(5,'0'),ts:Date.parse(r.criado_em),dia:r.dia,feira:r.feira_id,caixa:r.caixa_id,local:r.local,usuario:r.usuario_id,op:r.operador||'',itens:r.itens||[],sub:+r.sub,descItens:+r.desc_itens,desc:+r.desconto,total:+r.total,pags:r.pags||[],troco:+r.troco,cli:r.cli||{},nfDest:r.nf_dest,nf:r.nf,status:r.status,cancel:r.cancel,offline:r.offline});
const caixaDb=r=>({id:r.id,feira:r.feira_id,usuario:r.usuario_id,op:r.operador,local:r.local,fundo:+r.fundo,abert:Date.parse(r.abertura),movs:r.movs||[],fech:r.fechamento});
const feiraDb=r=>({id:r.id,nome:r.nome,end:r.endereco||'',inicio:r.inicio,fim:r.fim,local:r.local,meta:+r.meta,encerrada:r.encerrada});
const cliDb=r=>({doc:r.doc,nome:r.nome,email:r.email||'',end:r.endereco||{}});
const ERROS={SEM_ACESSO:'Seu acesso ainda não foi liberado por um gestor.',SO_GESTOR:'Só um gestor pode fazer isso.',CAIXA_FECHADO:'Este caixa já foi fechado. Abra outro.',CAIXA_INEXISTENTE:'Caixa não encontrado. Abra o caixa de novo.',VENDA_VAZIA:'A venda está vazia.',JUSTIFICATIVA_CURTA:'A justificativa precisa ter pelo menos 15 letras.',MOTIVO_OBRIGATORIO:'Informe o motivo.',NF_EM_PROCESSAMENTO:'A nota desta venda está sendo processada. Espere alguns segundos.',NF_JA_EM_ANDAMENTO:'Esta venda já tem nota emitida ou em andamento.',VENDA_CANCELADA:'Esta venda está cancelada.',NAO_PODE_SE_REBAIXAR:'Você não pode tirar o seu próprio acesso de gestor.',DESTINO_INVALIDO:'Escolha locais diferentes.',QTD_INVALIDA:'Quantidade inválida.',FAIXA_INVALIDA:'Faixa de números inválida.'};
function erroTxt(e){const m=String((e&&(e.message||e.error_description))||e||'');if(/ESTOQUE_INSUFICIENTE:([^:]*):(.*)/.test(m)){const x=m.match(/ESTOQUE_INSUFICIENTE:([^:]*):(.*)/);return 'Sem estoque de '+x[1]+' (saldo '+qfmt(+x[2])+').'}if(/TOTAL_NAO_CONFERE/.test(m))return 'O total da venda não confere. Refaça a venda.';if(/duplicate key.*sku/i.test(m)||(e&&e.code==='23505'&&/sku/.test(m)))return 'Já existe um produto com este SKU.';if(e&&e.code==='23505')return 'Registro repetido (SKU ou código de barras já usado).';if(/Failed to fetch|NetworkError|fetch failed|Load failed/i.test(m))return 'Sem internet.';const k=Object.keys(ERROS).find(k=>m.includes(k));return k?ERROS[k]:m||'Erro'}
const semRede=e=>/Failed to fetch|NetworkError|fetch failed|Load failed|network/i.test(String(e&&e.message||e));

/* saldos e consultas locais */
const saldo=(pid,local)=>{const s=D.estoque[pid]||{};return local?(s[local]||0):Object.values(s).reduce((a,b)=>a+b,0)};
const prods=(inativos)=>Object.values(D.produtos).filter(p=>inativos||p.ativo!==false).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
const feiraAt=()=>D.feiras[CTX.feira]||null;
const caixaAt=()=>{const c=D.caixas[CTX.caixa];return c&&!c.fech&&c.usuario===(USR&&USR.id)?c:null};
const vendasDe=(f)=>Object.values(D.vendas).filter(v=>!f||v.feira===f);
const pagLiq=v=>{const o={dinheiro:0,pix:0,debito:0,credito:0};(v.pags||[]).forEach(p=>{o[p.forma]=r2((o[p.forma]||0)+p.valor)});o.dinheiro=r2(o.dinheiro-(v.troco||0));return o};
function M(){const skuIx={},eanIx={};Object.values(D.produtos).forEach(p=>{if(p.sku)skuIx[norm(p.sku)]=p;if(p.ean)eanIx[String(p.ean).trim()]=p});return {skuIx,eanIx}}
function aplicaEstoque(r){(D.estoque[r.produto_id]||(D.estoque[r.produto_id]={}))[r.local]=+r.qtd}

/* ---------------------------------------------------------- conexão */
let syncMode='init',ONLINE=navigator.onLine,CANAL=null,ULT_SYNC=0;
const conf=()=>Object.assign({},window.PHOBOS_CONFIG||{},ls.get('phfeira.sb',{}));
function carregaLib(){if(window.supabase)return Promise.resolve();return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=SB_LIB;s.onload=ok;s.onerror=()=>ko(new Error('Não foi possível carregar o Supabase (sem internet?).'));document.head.appendChild(s)})}
async function iniciarSB(){
  const c=conf();if(!c.url||!c.anonKey)return false;
  await carregaLib();
  const op={auth:{persistSession:true,autoRefreshToken:true,storageKey:'phfeira.auth'}};
  if(window.__PHOBOS_TESTE)Object.assign(op,{accessToken:async()=>window.__PHOBOS_TESTE.token});
  SB=window.supabase.createClient(c.url,c.anonKey,op);return true;
}
async function sessaoAtual(){
  if(window.__PHOBOS_TESTE)return {id:window.__PHOBOS_TESTE.id,email:window.__PHOBOS_TESTE.email};
  const {data}=await SB.auth.getSession();return data&&data.session?data.session.user:null;
}
async function carregaPerfil(){const {data,error}=await SB.from('perfis').select('*').eq('id',USR.id).maybeSingle();if(error)throw error;EU=data;if(EU)ls.set('phfeira.eu',EU);return EU}
async function carregaTudo(){
  const desde=new Date(Date.now()-60*864e5).toISOString();
  const q=await Promise.all([
    SB.from('produtos').select('*').limit(10000),SB.from('estoque').select('produto_id,local,qtd').limit(50000),SB.from('feiras').select('*'),SB.from('config').select('dados').eq('id',1).maybeSingle(),
    SB.from('perfis').select('*'),SB.from('caixas').select('*').or('fechamento.is.null,abertura.gte.'+desde).limit(2000),SB.from('vendas').select('*').gte('criado_em',desde).order('criado_em',{ascending:false}).limit(5000),
    SB.from('clientes').select('*').limit(5000),SB.from('agente_status').select('*').eq('id',1).maybeSingle(),SB.from('nf_numeracao').select('*')]);
  const er=q.find(x=>x.error);if(er)throw er.error;
  const [pr,es,fe,co,pe,cx,ve,cl,ag,nn]=q.map(x=>x.data);
  D.produtos=Object.fromEntries(pr.map(r=>[r.id,prodDb(r)]));D.estoque={};es.forEach(aplicaEstoque);
  D.feiras=Object.fromEntries(fe.map(r=>[r.id,feiraDb(r)]));D.config.geral=(co&&co.dados)||{};
  D.perfis=Object.fromEntries(pe.map(r=>[r.id,r]));D.caixas=Object.fromEntries(cx.map(r=>[r.id,caixaDb(r)]));
  const loc=Object.values(D.vendas).filter(v=>v.pendenteEnvio);D.vendas=Object.fromEntries(ve.map(r=>[r.id,vendaDb(r)]));loc.forEach(v=>{if(!D.vendas[v.id])D.vendas[v.id]=v});
  D.clientes=Object.fromEntries(cl.map(r=>[r.doc,cliDb(r)]));D.agente=ag;D.numeracao=Object.fromEntries(nn.map(r=>[r.ambiente+'-'+r.serie,r.proximo]));
  if(!caixaAt()){const meu=Object.values(D.caixas).find(c=>c.usuario===USR.id&&!c.fech);if(meu)setCtx({caixa:meu.id,feira:meu.feira})}
  ULT_SYNC=Date.now();ls.set('phfeira.cache',{t:ULT_SYNC,produtos:D.produtos,estoque:D.estoque,feiras:D.feiras,config:D.config,caixas:D.caixas,clientes:D.clientes});
}
async function carregaVendasFeira(fid){if(!fid||UI['vf_'+fid])return;UI['vf_'+fid]=1;const {data}=await SB.from('vendas').select('*').eq('feira_id',fid).limit(20000);if(data){data.forEach(r=>{D.vendas[r.id]=vendaDb(r)});softRender()}}
function tempoReal(){
  if(CANAL||window.__PHOBOS_TESTE)return;
  const h={produtos:r=>{D.produtos[r.id]=prodDb(r)},estoque:r=>aplicaEstoque(r),vendas:r=>{D.vendas[r.id]=vendaDb(r)},feiras:r=>{D.feiras[r.id]=feiraDb(r)},caixas:r=>{D.caixas[r.id]=caixaDb(r)},config:r=>{D.config.geral=r.dados||{}},agente_status:r=>{D.agente=r},perfis:r=>{D.perfis[r.id]=r;if(EU&&r.id===EU.id)EU=r}};
  CANAL=SB.channel('phobos-feira');
  Object.keys(h).forEach(t=>CANAL.on('postgres_changes',{event:'*',schema:'public',table:t},pl=>{if(pl.new&&Object.keys(pl.new).length){h[t](pl.new);softRender();if(t==='vendas')ESPERA.forEach(f=>f(pl.new.id))}}));
  CANAL.subscribe(s=>{syncMode=s==='SUBSCRIBED'?'tempo-real':'online';renderSync()});
}
/* plano B sem tempo real: atualiza estoque, vendas do dia e o computador fiscal a cada 15 s */
async function atualizaLeve(){
  if(!SB||!USR||!ONLINE)return;
  try{
    const ontem=new Date(Date.now()-2*864e5).toISOString();
    const q=await Promise.all([SB.from('estoque').select('produto_id,local,qtd').gte('atualizado_em',new Date(ULT_SYNC-60000).toISOString()),SB.from('vendas').select('*').gte('criado_em',ontem).limit(2000),SB.from('agente_status').select('*').eq('id',1).maybeSingle(),SB.from('caixas').select('*').is('fechamento',null)]);
    if(q.some(x=>x.error))return;
    q[0].data.forEach(aplicaEstoque);q[1].data.forEach(r=>{D.vendas[r.id]=vendaDb(r)});D.agente=q[2].data;q[3].data.forEach(r=>{D.caixas[r.id]=caixaDb(r)});
    ULT_SYNC=Date.now();q[1].data.forEach(r=>ESPERA.forEach(f=>f(r.id)));softRender();
  }catch(e){}
}
setInterval(()=>{if(syncMode!=='tempo-real')atualizaLeve();else if(D.agente)renderSync()},15000);

/* fila para vender sem internet: as vendas sobem na ordem quando a conexão volta */
let FILA=ls.get('phfeira.fila',[]);const salvaFila=()=>ls.set('phfeira.fila',FILA);
let enviando=false;
async function enviaFila(){
  if(enviando||!FILA.length||!SB||!USR)return;enviando=true;
  try{while(FILA.length){const it=FILA[0];
    try{
      if(it.tipo==='venda'){const {data,error}=await SB.rpc('registrar_venda',{p:it.p});if(error)throw error;delete D.vendas[it.p.id];D.vendas[data.id]=vendaDb(data)}
      else if(it.tipo==='caixa'){const {error}=await SB.from('caixas').upsert(it.row);if(error)throw error}
      FILA.shift();salvaFila();
    }catch(e){if(semRede(e))break;toast('Não foi possível enviar um registro guardado: '+erroTxt(e),'bad');it.erro=erroTxt(e);FILA.shift();ls.set('phfeira.fila.erros',[...(ls.get('phfeira.fila.erros',[])),it]);salvaFila()}
  }}finally{enviando=false;renderSync();softRender()}
}
addEventListener('online',()=>{ONLINE=true;enviaFila();atualizaLeve();renderSync()});
addEventListener('offline',()=>{ONLINE=false;renderSync()});
setInterval(()=>{if(FILA.length&&ONLINE)enviaFila()},20000);

const agenteOnline=()=>!!(D.agente&&D.agente.visto_em&&Date.now()-Date.parse(D.agente.visto_em)<90000);
function renderSync(){
  const el=$('#sync');if(!el)return;
  let cls='ok',txt='Online';
  if(!ONLINE){cls='bad';txt='Sem internet'+(FILA.length?' · '+FILA.length+' a enviar':'')}
  else if(FILA.length){cls='warn';txt=FILA.length+' a enviar'}
  else if(syncMode==='tempo-real')txt='Tempo real';
  el.innerHTML='<span class="dot '+cls+'"></span><span class="txt">'+esc(txt)+'</span>'+(USR?'<span class="txt" style="opacity:.6">· '+esc((EU&&EU.nome)||USR.email||'')+'</span>':'');
  el.title=txt;
}

function cartCalc(){

  CART.itens.forEach(i=>{const b=r2(i.qtd*i.preco);const d=r2(b*(+i.dpct||0)/100);sub+=b;dItens+=d;q+=i.qtd});

  return {q,sub,dItens,dG,total:r2(base-dG)};
}

  if(CART.itens.length){toast('Finalize ou limpe a venda em andamento antes de fechar o caixa.','warn');return}
  const r=cxResumo(cx);
  const linhas=Object.keys(FORMAS).map(k=>'<tr><td>'+FORMAS[k].n+'</td><td class="r mono">'+brl(r.esp[k])+'</td><td style="width:140px"><input class="i mono" data-ct="'+k+'" inputmode="decimal" placeholder="'+nfmt(r.esp[k],2)+'"></td><td class="r mono" data-df="'+k+'">—</td></tr>').join('');
  modal({title:'Fechar caixa',body:
    '<div class="kpis" style="margin:0"><div class="kpi"><div class="l">Vendas</div><div class="v">'+r.vs.length+'</div></div><div class="kpi"><div class="l">Total vendido</div><div class="v">'+brl(r.total)+'</div></div><div class="kpi"><div class="l">Fundo + supr. − sangria</div><div class="v">'+brl(r2((cx.fundo||0)+r.supr-r.sang))+'</div></div></div>'+
    '<div class="muted small">Conte o dinheiro da gaveta e confira os relatórios da maquininha e do PIX. Campo vazio = valor esperado.</div>'+
    '<table class="tbl"><thead><tr><th>Forma</th><th class="r">Esperado</th><th>Contado</th><th class="r">Diferença</th></tr></thead><tbody>'+linhas+'</tbody></table>'+
    '<label class="f">Observações<textarea class="i" id="fcO"></textarea></label>',
    foot:'<button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" id="fcOk">Fechar caixa</button>',
    init:m=>{
      const calc=()=>{const o={};Object.keys(FORMAS).forEach(k=>{const v=$('[data-ct="'+k+'"]').value.trim();o[k]=v===''?r.esp[k]:r2(num(v));const d=r2(o[k]-r.esp[k]);const el=$('[data-df="'+k+'"]');el.textContent=d?(d>0?'+ ':'− ')+brl(Math.abs(d)):'—';el.style.color=d?(d>0?'var(--ok)':'var(--bad)'):''});return o};
      $$('[data-ct]',m).forEach(i=>i.oninput=calc);
      $('#fcOk',m).onclick=async()=>{const ct=calc();const c2=JSON.parse(JSON.stringify(cx));c2.fech={ts:Date.now(),contado:ct,esperado:r.esp,obs:$('#fcO').value.trim(),total:r.total,nv:r.vs.length};if(!await gravaCaixa(c2))return;setCtx({caixa:''});closeModal();toast('Caixa fechado');render();modal({title:'Caixa fechado',size:'s',body:fechHtml(c2),foot:(PODE_IMP?'<button class="btn" id="fxP">'+IC.imp+' Imprimir</button>':'')+'<button class="btn pri" data-act="mclose">Concluir</button>',init:m=>{const p=$('#fxP',m);if(p)p.onclick=()=>imprimirFech(c2)}})}}});
}

function cpfOk(c){c=so(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(const t of [9,10]){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);let d=(s*10)%11;if(d===10)d=0;if(d!==+c[t])return false}return true}
function cnpjOk(c){c=so(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}

async function buscaCep(cep){
  cep=so(cep);if(cep.length!==8)throw new Error('CEP inválido');
  let j;try{const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');j=await r.json()}catch(e){throw new Error('Sem internet para buscar o CEP. Preencha à mão.')}
  if(j.erro)throw new Error('CEP não encontrado');
  return {lgr:j.logradouro,bairro:j.bairro,xMun:j.localidade,uf:j.uf,cMun:j.ibge,cep};
}

function agenteTxt(){
  const a=D.agente;if(!a||!a.visto_em)return 'O computador fiscal nunca se conectou. Instale o PHOBOS Fiscal.';
  const min=Math.round((Date.now()-Date.parse(a.visto_em))/60000);
  return agenteOnline()?'Computador fiscal on-line':'Computador fiscal fora do ar (visto há '+(min<60?min+' min':Math.round(min/60)+' h')+'). A nota fica na fila e sai quando ele voltar.';
}
function aguardarNF(v,aoFim,fimFn,titulo){

  modal({title:titulo||'Emitindo NF-e',size:'s',lock:true,body:'<div class="empty" style="padding:24px 8px"><div class="spin"></div><h3 style="margin-top:14px">'+(ag?'Enviando para a SEFAZ…':'Computador fiscal fora do ar')+'</h3><div class="small">'+(ag?'Venda nº '+esc(v.num)+' · '+brl(v.total):esc(agenteTxt()))+'</div></div>',foot:'<button class="btn ghost" id="agSeguir">Seguir sem esperar</button>'});
  let acabou=false,t=null,to=null;
  const terminar=()=>{if(acabou)return;acabou=true;ESPERA.delete(cb);clearInterval(t);clearTimeout(to);MODAL=null;closeModal();(aoFim||recibo)(D.vendas[v.id]||v,true)};
  const cb=id=>{if(id===v.id&&fim((D.vendas[id]||{}).nf))terminar()};

function code128c(dig){
  dig=so(dig);if(dig.length%2)dig='0'+dig;const vals=[105];for(let i=0;i<dig.length;i+=2)vals.push(+dig.substr(i,2));
  let ck=vals[0];for(let i=1;i<vals.length;i++)ck+=vals[i]*i;vals.push(ck%103);vals.push(106);
  let x=10,bars='';vals.forEach(v=>{const p=C128[v];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="50"/>';x+=w}});
  return '<svg class="bc" viewBox="0 0 '+(x+10)+' 50" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="#000">'+bars+'</svg>';
}

async function finalizar(k,P,dest,cli){
  const cx=caixaAt();if(!cx){toast('Abra o caixa primeiro.','warn');return}
  const pago=r2(P.pags.reduce((a,p)=>a+p.valor,0));const troco=r2(Math.max(0,pago-k.total));
  const din=P.pags.filter(p=>p.forma==='dinheiro').reduce((a,p)=>a+p.valor,0);
  if(troco>din+0.001){toast('O troco só pode sair de pagamento em dinheiro.','bad');return}
  const id=uid();
  const itens=CART.itens.map(i=>({prod:i.prod,sku:i.sku,nome:i.nome,qtd:i.qtd,preco:i.preco,custo:i.custo||0,dpct:+i.dpct||0,total:r2(i.qtd*i.preco*(1-(+i.dpct||0)/100))}));
  const p={id,ts:new Date().toISOString(),feira_id:cx.feira,caixa_id:cx.id,local:cx.local,itens,sub:k.sub,desc_itens:k.dItens,desconto:k.dG,total:k.total,pags:P.pags,troco,cli,nf_dest:dest||null,emitir_nf:!!dest};
  const b=$('#pyFim');if(b){b.disabled=true;b.textContent='Registrando…'}
  let v;
  try{
    if(!ONLINE)throw new TypeError('Failed to fetch');
    const {data,error}=await SB.rpc('registrar_venda',{p});if(error)throw error;v=vendaDb(data);
  }catch(e){
    if(!semRede(e)){toast(erroTxt(e),'bad');if(b){b.disabled=false;b.textContent=dest?'Finalizar e emitir NF-e':'Finalizar venda'}return}
    p.offline=true;FILA.push({tipo:'venda',p});salvaFila();
    v={id,num:'—',ts:Date.now(),dia:today(),feira:cx.feira,caixa:cx.id,local:cx.local,usuario:USR.id,op:EU.nome,itens,sub:k.sub,descItens:k.dItens,desc:k.dG,total:k.total,pags:P.pags,troco,cli,nfDest:dest,nf:dest?{status:'pendente'}:null,status:'ok',pendenteEnvio:true};
    itens.forEach(i=>{(D.estoque[i.prod]||(D.estoque[i.prod]={}))[cx.local]=r2(saldo(i.prod,cx.local)-i.qtd)});
    toast('Sem internet: venda guardada no aparelho. Ela sobe sozinha quando a conexão voltar.','warn');renderSync();
  }
  if(dest)salvaCliente(dest);
  D.vendas[v.id]=v;CART={itens:[],descT:'R$',descV:0};saveCart();closeModal();renderCart();renderProdGrid();
  if(dest&&!v.pendenteEnvio)aguardarNF(v);else recibo(v,true);
}

let SCAN=null;
async function scanCam(onCode){
  if(!('BarcodeDetector' in window)){toast('Este navegador não lê código pela câmera. Use um leitor USB ou digite.','warn');return}
  modal({title:'Ler código de barras',size:'s',body:'<video class="scan" id="scV" playsinline muted></video><div class="muted small">Aponte a câmera para o código de barras.</div>',foot:'<button class="btn ghost" data-act="mclose">Fechar</button>'});
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const vd=$('#scV');if(!vd){st.getTracks().forEach(t=>t.stop());return}
    vd.srcObject=st;await vd.play();const det=new BarcodeDetector();SCAN={st,on:true};
    const loop=async()=>{if(!SCAN||!SCAN.on)return;try{const r=await det.detect(vd);if(r&&r.length){const code=r[0].rawValue;stopScan();closeModal();onCode(code);return}}catch(e){}requestAnimationFrame(loop)};loop();
  }catch(e){toast('Não foi possível usar a câmera.','bad');closeModal()}
}

function reduzFoto(file,max){return new Promise((ok,ko)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?ok(b):ko(new Error('falhou')),'image/jpeg',.82)};img.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('imagem inválida'))};img.src=u})}
async function enviaFoto(pid,blob){

  if(error){toast('Não foi possível enviar a foto: '+(error.message||error)+'. Confira se o schema.sql mais novo foi rodado no Supabase.','bad');return null}
  return SB.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
}

const XLSX_URL='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=XLSX_URL;s.onload=()=>ok(window.XLSX);s.onerror=()=>ko(new Error('xlsx'));document.head.appendChild(s);setTimeout(()=>ko(new Error('timeout')),12000)})}
function csvCell(v){v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function baixar(nome,blob){
  if(EMB){let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
    if(!dl){toast('Download indisponível nesta tela. Use a versão offline do PHOBOS Feira.','bad');return false}
    try{await dl.save({filename:nome,data:blob});return true}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o arquivo ('+((e&&e.code)||'erro')+').','bad');return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
async function exportar(nome,sheets){ // sheets: [{nome, linhas:[[...]]}]
  let X=null;try{X=await loadXLSX()}catch(e){}
  if(X){const wb=X.utils.book_new();sheets.forEach(s=>{const ws=X.utils.aoa_to_sheet(s.linhas);ws['!cols']=s.linhas[0].map((_,i)=>({wch:Math.min(48,Math.max(8,...s.linhas.slice(0,200).map(r=>String(r[i]??'').length+2)))}));X.utils.book_append_sheet(wb,ws,s.nome.slice(0,31))});
    const out=X.write(wb,{type:'array',bookType:'xlsx'});if(await baixar(nome+'.xlsx',new Blob([out])))toast('Planilha gerada');return}
  const s=sheets[0];const csv='\ufeff'+s.linhas.map(r=>r.map(v=>typeof v==='number'?String(v).replace('.',','):csvCell(v)).join(';')).join('\r\n');if(await baixar(nome+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'})))toast('Sem internet: exportei em CSV (abre no Excel).','warn');
}
function parseCSV(t){t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';const rows=[];let r=[],v='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(v);v=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=ch}
  if(v!==''||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(c=>String(c).trim()!==''))}

        $('#ipOk').disabled=!rows.length};
      $('#ipOk',m).onclick=async()=>{if(!rows)return;const loc=$('#ipL').value;const ent=[];let n=0;const lote=[];
        rows.forEach(r=>{const ex=M().skuIx[norm(r.sku)];const o=Object.assign({},ex||{id:uid(),ativo:true,preco:0,custo:0,min:0},{sku:r.sku,nome:r.nome});

          lote.push(prodParaDb(o));n++;if(r.qtd)ent.push({produto_id:o.id,qtd:r.qtd})});

function relDados(fid){
  const vs=vendasDe(fid);const ok=vs.filter(v=>v.status!=='cancelada');
  const tot=r2(ok.reduce((a,v)=>a+v.total,0));const pcs=ok.reduce((a,v)=>a+v.itens.reduce((b,i)=>b+i.qtd,0),0);
  const desc=r2(ok.reduce((a,v)=>a+(v.desc||0)+(v.descItens||0),0));
  const custo=r2(ok.reduce((a,v)=>a+v.itens.reduce((b,i)=>b+i.qtd*(i.custo||0),0),0));
  const pf={dinheiro:0,pix:0,debito:0,credito:0};ok.forEach(v=>{const l=pagLiq(v);for(const k in pf)pf[k]=r2(pf[k]+l[k])});
  const pd={};ok.forEach(v=>{pd[v.dia]=pd[v.dia]||{n:0,t:0};pd[v.dia].n++;pd[v.dia].t=r2(pd[v.dia].t+v.total)});
  const pp={};ok.forEach(v=>v.itens.forEach(i=>{const k=i.prod;pp[k]=pp[k]||{sku:i.sku,nome:i.nome,q:0,t:0,c:0};pp[k].q+=i.qtd;pp[k].t=r2(pp[k].t+i.total);pp[k].c=r2(pp[k].c+i.qtd*(i.custo||0))}));

async function salvarFiscal(){
  const c=cfg();const g=id=>{const el=$('#'+id);return el?el.value.trim():''};
  const emit={cnpj:so(g('feCnpj')),ie:g('feIe').toUpperCase()==='ISENTO'?'ISENTO':so(g('feIe')),razao:g('feRaz'),fantasia:g('feFan'),fone:so(g('feTel')),end:{cep:so(g('feCep')),lgr:g('feLgr'),nro:g('feNro'),cpl:g('feCpl'),bairro:g('feBai'),xMun:g('feMun'),uf:g('feUF'),cMun:so(g('feIbge'))}};
  if(emit.cnpj&&!cnpjOk(emit.cnpj)){toast('CNPJ do emitente inválido','bad');return}
  if(emit.end.cMun&&emit.end.uf&&UFCOD[emit.end.uf]!==+emit.end.cMun.slice(0,2)){toast('O código IBGE não é da UF do emitente','bad');return}
  const f=Object.assign({},c.fiscal,{ambiente:+g('fsAmb')||2,serie:+g('fsSer')||1,indPres:+g('fsPres')||5,natOp:g('fsNat')||'VENDA DE MERCADORIA',cfop:g('fsCfop'),crt:+g('fsCrt')||1,
    pisCst:g('fsPisC')||'99',pPis:num(g('fsPisA')),cofinsCst:g('fsCofC')||'99',pCofins:num(g('fsCofA')),infCpl:g('fsInf'),respTec:{cnpj:so(g('rtCnpj')),contato:g('rtCont'),email:g('rtMail'),fone:so(g('rtTel'))}});
  f.csosn=g('fsCsosn')||'102';f.cstIcms=g('fsCst')||'00';f.pIcms=num(g('fsPIcms'));
  f.cfopInter=g('fsCfopI');f.ufs={};$$('#ufRows [data-uf]').forEach(r=>{const u=$('[data-ufc]',r).value;const pi=num($('[data-ufi]',r).value);if(u&&pi>0)f.ufs[u]={pInterna:pi,pFCP:num($('[data-uff]',r).value),iest:so($('[data-ufs]',r).value)}});
  if(c.fiscal.ambiente!==f.ambiente&&f.ambiente===1&&!salvarFiscal.ok){confirmar('Passar para produção','Em produção as notas têm valor fiscal e os números contam para valer. Faça isso só depois de testar em homologação.',()=>{salvarFiscal.ok=true;salvarFiscal();salvarFiscal.ok=false},'Passar para produção',true);return}
  if(!await saveCfg({emit,fiscal:f,nfAuto:$('#fsAuto').checked}))return;
  const n=+g('fsNum'),k=(f.ambiente===1?1:2)+'-'+f.serie;
  if(n>0&&n!==+D.numeracao[k]){const {error}=await SB.rpc('definir_numero_nf',{p_amb:f.ambiente===1?1:2,p_serie:f.serie,p_proximo:n});if(error){toast(erroTxt(error),'bad');return}D.numeracao[k]=n}
  toast('Configuração fiscal salva');
}

    };
    if(A[k]){e.preventDefault();A[k]()}return}
  const ad=t.closest('[data-add]');if(ad){const p=D.produtos[ad.dataset.add];if(p)addCart(p);focusBusca();return}
  const ct=t.closest('[data-cat]');if(ct){UI.cat=ct.dataset.cat;render();return}
  const q=t.closest('[data-q]');if(q){const i=CART.itens[+q.dataset.q];if(!i)return;const d=+q.dataset.d;if(d>0){const p=D.produtos[i.prod];const c=caixaAt();const s=saldo(i.prod,c&&c.local)-CART.itens.filter(x=>x.prod===i.prod&&x!==i).reduce((a,x)=>a+x.qtd,0);if(i.qtd+1>s){if(cfg().bloqueia){toast('Sem estoque suficiente (saldo '+qfmt(s)+').','bad');return}toast('Atenção: saldo de '+(p?p.nome:'')+' é '+qfmt(s)+'.','warn')}}i.qtd=r2(i.qtd+d);if(i.qtd<=0)CART.itens.splice(+q.dataset.q,1);saveCart();renderCart();return}
  const rm=t.closest('[data-rm]');if(rm){CART.itens.splice(+rm.dataset.rm,1);saveCart();renderCart();focusBusca();return}
  const vd=t.closest('[data-venda]');if(vd){vendaDet(vd.dataset.venda);return}
  if(t.matches('[data-sel]')){if(t.checked)UI.sel.add(t.dataset.sel);else UI.sel.delete(t.dataset.sel);render();return}
  if(t.id==='selAll'){const q2=norm(UI.estQ);const ps=prods(true).filter(p=>(UI.estInat||p.ativo!==false)&&(!UI.estCat||p.cat===UI.estCat)&&(!q2||norm(p.nome+' '+p.sku+' '+(p.ean||'')+' '+(p.var||'')).includes(q2))&&(!UI.estBaixo||(p.ativo!==false&&saldo(p.id)<=(+p.min||0))));if(t.checked)ps.forEach(p=>UI.sel.add(p.id));else ps.forEach(p=>UI.sel.delete(p.id));render();return}
  const pr=t.closest('[data-prod]');if(pr&&!t.closest('[data-sel]')&&!t.matches('input')){if(ehAdmin())prodForm(pr.dataset.prod);return}
  const es=t.closest('[data-est]');if(es){UI.est=es.dataset.est;render();return}
  const cx=t.closest('[data-cx]');if(cx){const c=D.caixas[cx.dataset.cx];if(c)modal({title:'Caixa de '+dtBR(c.abert),size:'s',body:fechHtml(c),foot:(PODE_IMP?'<button class="btn" id="fxP">'+IC.imp+' Imprimir</button>':'')+'<button class="btn ghost" data-act="mclose">Fechar</button>',init:m=>{const p=$('#fxP',m);if(p)p.onclick=()=>imprimirFech(c)}});return}
  const pfs=t.closest('[data-pfs]');if(pfs){const id=pfs.dataset.pfs;(async()=>{const {error}=await SB.rpc('ajustar_perfil',{p_id:id,p_nome:$('[data-pfn="'+id+'"]').value,p_papel:$('[data-pfp="'+id+'"]').value,p_ativo:$('[data-pfa="'+id+'"]').checked});if(error){toast(erroTxt(error),'bad');return}const {data}=await SB.from('perfis').select('*');(data||[]).forEach(r=>{D.perfis[r.id]=r});toast('Equipe atualizada');render()})();return}
  const xm=t.closest('[data-xml]');if(xm){baixarXml(xm.dataset.xml);return}
  const ufr=t.closest('[data-ufrm]');if(ufr){UI.estrut=true;ufr.closest('tr').remove();return}
  const ct2=t.closest('[data-cfgtab]');if(ct2){UI.cfgTab=ct2.dataset.cfgtab;render();return}
  const dn=t.closest('[data-danfe]');if(dn){const v=D.vendas[dn.dataset.danfe];if(v)verDanfe(v);return}
  const nd=t.closest('[data-nfdest]');if(nd){const v=D.vendas[nd.dataset.nfdest];if(v){closeModal();editarDest(v,VIEW==='vendas'?()=>{render();vendaDet(v.id)}:null)}return}
  const nr=t.closest('[data-nfre]');if(nr){const v=D.vendas[nr.dataset.nfre];if(v){closeModal();pedirNF(v)}return}
  const nn=t.closest('[data-nfnova]');if(nn){const v=D.vendas[nn.dataset.nfnova];if(v){closeModal();emitirDepois(v)}return}
});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(!e.isTrusted||!t||!t.closest||!t.closest('#main')||!t.matches('input,textarea,select')||t.type==='file')return;const k=chaveCampo(t);if(!k)return;(UI.ed||(UI.ed=new Map())).set(k,{v:t.value,c:t.checked})},true));
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='busca'){UI.busca=t.value;renderProdGrid();return}
  if(t.id==='vfQ'){UI.vQ=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{render();const el=$('#vfQ');el.focus();el.setSelectionRange(el.value.length,el.value.length)},250);return}
  if(t.id==='esQ'){UI.estQ=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{render();const el=$('#esQ');el.focus();el.setSelectionRange(el.value.length,el.value.length)},250);return}
  if(t.matches('[data-doc]')){const d=t.value.replace(/\D/g,'').slice(0,14);let v=d;if(d.length<=11)v=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');else v=d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');t.value=v}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-qi]')){const i=CART.itens[+t.dataset.qi];if(i){const q=num(t.value);if(q>0)i.qtd=r2(q);else CART.itens.splice(+t.dataset.qi,1);saveCart();renderCart()}return}
  if(t.matches('[data-dp]')){const i=CART.itens[+t.dataset.dp];if(i){i.dpct=Math.min(100,Math.max(0,num(t.value)));saveCart();renderCart()}return}
  if(t.id==='descT'){CART.descT=t.value;saveCart();renderCart();return}
  if(t.id==='descV'){CART.descV=Math.max(0,num(t.value));if(CART.descT==='%')CART.descV=Math.min(100,CART.descV);saveCart();renderCart();return}
  if(t.id==='vfF'){UI.vFeira=t.value;render();return}
  if(t.id==='vfD'){UI.vDia=t.value;render();return}
  if(t.id==='vfS'){UI.vSt=t.value;render();return}
  if(t.id==='vfN'){UI.vNf=t.value;render();return}
  if(t.id==='fsCrt'){const sn=t.value!=='3';$('#grpSN').classList.toggle('hide',!sn);$('#grpRN1').classList.toggle('hide',sn);$('#grpRN2').classList.toggle('hide',sn);if(!sn&&$('#fsPisC').value==='99'){$('#fsPisC').value='01';$('#fsCofC').value='01';if(!num($('#fsPisA').value))$('#fsPisA').value='1,65';if(!num($('#fsCofA').value))$('#fsCofA').value='7,60'}return}
  if(t.id==='esC'){UI.estCat=t.value;render();return}
  if(t.id==='esI'){UI.estInat=t.checked;render();return}
  if(t.id==='esB'){UI.estBaixo=t.checked;render();return}
  if(t.id==='frSel'){UI.relFeira=t.value;render();return}
  if(t.id==='cgB'){saveCfg({bloqueia:t.checked}).then(ok=>ok&&toast('Salvo'));return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&MODAL){if(!MODAL.lock&&!MODAL.sujo&&!$$('#modal input,#modal textarea,#modal select').length)closeModal();return}
  if(e.target.id==='busca'&&e.key==='Enter'){e.preventDefault();buscaEnter();return}
  if(e.key==='F2'&&VIEW==='balcao'&&!MODAL){e.preventDefault();pagar();return}
});

iniciar();
</script>
</body>
</html>
